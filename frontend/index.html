<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --accent-orange: #f97316;
            --accent-cyan: #06b6d4;
            --border-color: #334155;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .controls {
            display: flex;
            gap: 12px;
        }

        select {
            padding: 12px 16px;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
        }

        select:hover {
            border-color: var(--accent-blue);
        }

        select:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        button {
            padding: 12px 20px;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: var(--accent-blue-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--card-accent, var(--accent-blue));
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--card-accent, var(--accent-blue));
        }

        .stat-card.temperature { --card-accent: var(--accent-blue); }
        .stat-card.humidity { --card-accent: var(--accent-green); }
        .stat-card.pressure { --card-accent: var(--accent-purple); }
        .stat-card.wind { --card-accent: var(--accent-cyan); }

        .stat-card h3 {
            color: var(--text-secondary);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-card .value {
            font-size: 42px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 16px;
        }

        .stat-card .value.blue { color: var(--accent-blue); }
        .stat-card .value.green { color: var(--accent-green); }
        .stat-card .value.purple { color: var(--accent-purple); }
        .stat-card .value.cyan { color: var(--accent-cyan); }

        .stat-card .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .stat-card .detail-item {
            text-align: center;
        }

        .stat-card .detail-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .stat-card .detail-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .chart-container {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .chart-container h2 {
            margin-bottom: 20px;
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-wrapper {
            position: relative;
            height: 320px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .charts-grid .chart-wrapper {
            height: 280px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-secondary);
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 20px;
            color: var(--accent-green);
            font-size: 12px;
            margin-left: 16px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 768px) {
            body { padding: 16px; }
            header { flex-direction: column; gap: 16px; }
            .charts-grid { grid-template-columns: 1fr; }
            .stat-card .details { grid-template-columns: 1fr; gap: 12px; }
            .stat-card .detail-item { text-align: left; display: flex; justify-content: space-between; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">🌤️</div>
                <h1>Weather Dashboard</h1>
                <span class="status-badge">
                    <span class="status-dot"></span>
                    Live
                </span>
            </div>
            <div class="controls">
                <select id="daysSelect">
                    <option value="1">Last 24 hours</option>
                    <option value="7" selected>Last 7 days</option>
                    <option value="14">Last 14 days</option>
                    <option value="30">Last 30 days</option>
                </select>
                <button onclick="loadData()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 4v6h-6M1 20v-6h6M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
                    </svg>
                    Refresh
                </button>
            </div>
        </header>

        <div id="error" class="error" style="display:none"></div>

        <div id="loading" class="loading" style="display:none">
            <div class="loading-spinner"></div>
            <div>Loading weather data...</div>
        </div>

        <div id="stats" class="stats"></div>

        <div class="chart-container">
            <h2>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2">
                    <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>
                </svg>
                Temperature Trend
            </h2>
            <div class="chart-wrapper">
                <canvas id="tempChart"></canvas>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-container">
                <h2>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2">
                        <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                    </svg>
                    Humidity Trend
                </h2>
                <div class="chart-wrapper">
                    <canvas id="humidityChart"></canvas>
                </div>
            </div>
            <div class="chart-container">
                <h2>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
                    </svg>
                    Pressure Trend
                </h2>
                <div class="chart-wrapper">
                    <canvas id="pressureChart"></canvas>
                </div>
            </div>
        </div>

        <footer>
            Weather data from local sensors • Updated automatically
        </footer>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        let charts = {};

        Chart.defaults.color = '#94a3b8';
        Chart.defaults.borderColor = '#334155';

        async function fetchData(days) {
            const response = await fetch(`${API_URL}/api/outside?days=${days}`);
            if (!response.ok) throw new Error('Failed to fetch data');
            return response.json();
        }

        async function fetchStats(days) {
            const response = await fetch(`${API_URL}/api/outside/stats?days=${days}`);
            if (!response.ok) throw new Error('Failed to fetch stats');
            return response.json();
        }

        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error').style.display = 'none';
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('stats').style.display = 'none';
            document.querySelector('.chart-container').style.display = 'none';
            document.querySelector('.charts-grid').style.display = 'none';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('stats').style.display = 'grid';
            document.querySelector('.chart-container').style.display = 'block';
            document.querySelector('.charts-grid').style.display = 'grid';
        }

        function renderStats(stats) {
            const container = document.getElementById('stats');
            container.innerHTML = `
                <div class="stat-card temperature">
                    <h3>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>
                        </svg>
                        Temperature
                    </h3>
                    <div class="value blue">${stats.temperature.current?.toFixed(1) ?? '--'}°C</div>
                    <div class="details">
                        <div class="detail-item">
                            <div class="detail-label">Min</div>
                            <div class="detail-value">${stats.temperature.min?.toFixed(1) ?? '--'}°C</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Max</div>
                            <div class="detail-value">${stats.temperature.max?.toFixed(1) ?? '--'}°C</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Avg</div>
                            <div class="detail-value">${stats.temperature.mean?.toFixed(1) ?? '--'}°C</div>
                        </div>
                    </div>
                </div>
                <div class="stat-card humidity">
                    <h3>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                        </svg>
                        Humidity
                    </h3>
                    <div class="value green">${stats.humidity.current?.toFixed(1) ?? '--'}%</div>
                    <div class="details">
                        <div class="detail-item">
                            <div class="detail-label">Min</div>
                            <div class="detail-value">${stats.humidity.min?.toFixed(1) ?? '--'}%</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Max</div>
                            <div class="detail-value">${stats.humidity.max?.toFixed(1) ?? '--'}%</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Avg</div>
                            <div class="detail-value">${stats.humidity.mean?.toFixed(1) ?? '--'}%</div>
                        </div>
                    </div>
                </div>
                <div class="stat-card pressure">
                    <h3>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
                        </svg>
                        Pressure
                    </h3>
                    <div class="value purple">${stats.pressure.current?.toFixed(0) ?? '--'} <span style="font-size: 18px; color: var(--text-secondary);">hPa</span></div>
                    <div class="details">
                        <div class="detail-item">
                            <div class="detail-label">Min</div>
                            <div class="detail-value">${stats.pressure.min?.toFixed(0) ?? '--'} hPa</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Max</div>
                            <div class="detail-value">${stats.pressure.max?.toFixed(0) ?? '--'} hPa</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Avg</div>
                            <div class="detail-value">${stats.pressure.mean?.toFixed(0) ?? '--'} hPa</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function createChart(canvasId, label, data, color) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            
            if (charts[canvasId]) {
                charts[canvasId].destroy();
            }

            const gradient = ctx.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, color + '40');
            gradient.addColorStop(1, color + '00');

            charts[canvasId] = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: label,
                        data: data,
                        borderColor: color,
                        backgroundColor: gradient,
                        borderWidth: 2.5,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 6,
                        pointHoverBackgroundColor: color,
                        pointHoverBorderColor: '#fff',
                        pointHoverBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#1e293b',
                            titleColor: '#f1f5f9',
                            bodyColor: '#94a3b8',
                            borderColor: '#334155',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: false,
                            callbacks: {
                                label: function(context) {
                                    return `${label}: ${context.parsed.y.toFixed(1)}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: { 
                                unit: 'hour',
                                displayFormats: {
                                    hour: 'MMM dd HH:mm'
                                }
                            },
                            grid: {
                                color: '#334155',
                                drawBorder: false
                            },
                            ticks: {
                                maxTicksLimit: 12
                            }
                        },
                        y: {
                            grid: {
                                color: '#334155',
                                drawBorder: false
                            },
                            ticks: {
                                padding: 10
                            }
                        }
                    }
                }
            });
        }

        async function loadData() {
            hideError();
            showLoading();
            
            const days = parseInt(document.getElementById('daysSelect').value);
            
            try {
                const [dataRes, statsRes] = await Promise.all([
                    fetchData(days),
                    fetchStats(days)
                ]);

                if (dataRes.count === 0) {
                    showError('No data available for the selected period. Try selecting a different time range.');
                    hideLoading();
                    return;
                }

                renderStats(statsRes);

                // Temperature chart
                const data = dataRes.data.map(d => ({
                    x: new Date(d.datetime),
                    y: d.temperature
                }));
                createChart('tempChart', 'Temperature', data, '#3b82f6');

                // Humidity chart
                const humidityData = dataRes.data.map(d => ({
                    x: new Date(d.datetime),
                    y: d.humidity
                }));
                createChart('humidityChart', 'Humidity', humidityData, '#10b981');

                // Pressure chart
                const pressureData = dataRes.data.map(d => ({
                    x: new Date(d.datetime),
                    y: d.pressure
                }));
                createChart('pressureChart', 'Pressure', pressureData, '#8b5cf6');

                hideLoading();

            } catch (error) {
                showError('Error loading data: ' + error.message + '. Make sure the backend is running on port 8000.');
                hideLoading();
            }
        }

        document.getElementById('daysSelect').addEventListener('change', loadData);
        
        // Initial load
        loadData();
    </script>
</body>
</html>
